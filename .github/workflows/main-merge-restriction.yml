name: Enforce Develop to Main PR Only

on:
  pull_request:
    branches:
      - main

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR source branch is develop
        if: github.head_ref != 'develop'
        run: |
          echo "ERROR: Merges to 'main' are only allowed from the 'develop' branch."
          echo "Your PR is trying to merge from '${{ github.head_ref }}'."
          exit 1
